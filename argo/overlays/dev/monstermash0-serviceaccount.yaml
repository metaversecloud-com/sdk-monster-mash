# IRSA: the pod assumes this role to reach the sdk-monster-mash bucket, which
# lives in topia-sdk-prod (471112828260) while this cluster is in 368076259134.
# The role is created by tofu/ (output dev_irsa_role_arn) -- apply that before
# this lands, or the pod gets a role that does not exist yet.
#
# Dev-only on purpose: the annotation names a dev-account role, so another env
# needs its own ServiceAccount with its own role ARN.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monstermash0-sa
  labels:
    app.kubernetes.io/name: monstermash0
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::368076259134:role/sdk-apps-dev-monstermash0-irsa
