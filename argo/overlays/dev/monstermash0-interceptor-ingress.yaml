# Front door for scale-to-zero: ALB (group topia-dev) -> KEDA HTTP interceptor
# -> wakes monstermash0 0->1, holds the request, forwards it. MUST live in `keda` ns.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monstermash0-interceptor
  namespace: keda
  annotations:
    alb.ingress.kubernetes.io/group.name: topia-dev
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200,404"
spec:
  ingressClassName: alb
  rules:
    - host: monstermash0-dev-topia.topia-rtsdk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-add-ons-http-interceptor-proxy
                port:
                  number: 8080
