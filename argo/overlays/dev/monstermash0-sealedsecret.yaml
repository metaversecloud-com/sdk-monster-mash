# No clear secrets in git. Ciphertext only; the in-cluster sealed-secrets
# controller unseals it into Secret monstermash0-secrets (envFrom). Sealed (strict
# scope) against the dev cluster cert for namespace sdk-apps-dev.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: monstermash0-secrets
  namespace: sdk-apps-dev
spec:
  encryptedData:
    INTERACTIVE_SECRET: 
  template:
    metadata:
      name: monstermash0-secrets
      namespace: sdk-apps-dev
    type: Opaque
