apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/monstermash0
  - monstermash0-config.yaml
  - monstermash0-serviceaccount.yaml
  - monstermash0-sealedsecret.yaml
  - monstermash0-httpscaledobject.yaml
patches:
  # Run as the IRSA ServiceAccount rather than the default one, so the pod gets
  # its own AWS identity instead of the node role.
  - target:
      kind: Deployment
      name: monstermash0
    patch: |
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: monstermash0-sa
  # Drop the direct ALB Ingress: dev is fronted through the KEDA interceptor.
  - target:
      kind: Ingress
      name: monstermash0
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: monstermash0
images:
  - name: monstermash0
    newName: 368076259134.dkr.ecr.us-east-1.amazonaws.com/sdk-example
    newTag: sdk-monster-mash
    digest: sha256:ea5861340423074248062cbed737fa31f57c183aaa56cfb4807858e74125df8d
